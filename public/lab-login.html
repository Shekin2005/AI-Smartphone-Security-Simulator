<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scanner login — AI Smartphone Security Simulator</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0b1220;
      color: #e8eef7;
      font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
    }
    main {
      width: min(360px, 92vw);
      padding: 26px 24px 22px;
      background: #111c2e;
      border: 1px solid #1e3050;
      border-radius: 14px;
    }
    h1 { margin: 0 0 4px; font-size: 17px; }
    p.sub { margin: 0 0 18px; color: #93a4bf; font-size: 12.5px; }
    label { display: block; margin: 12px 0 5px; font-size: 12.5px; color: #93a4bf; }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 9px 10px;
      background: #0b1220;
      color: #e8eef7;
      border: 1px solid #24395c;
      border-radius: 8px;
      font: inherit;
    }
    input:focus, select:focus { outline: 2px solid #38bdf8; outline-offset: 1px; }
    button {
      width: 100%;
      margin-top: 18px;
      padding: 10px;
      background: #38bdf8;
      color: #06283d;
      border: 0;
      border-radius: 8px;
      font: 600 15px "Segoe UI", system-ui, sans-serif;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: default; }
    #status { margin: 14px 0 0; min-height: 20px; font-size: 13px; color: #fbbf24; }
    #signed-in {
      margin-top: 14px;
      padding: 10px 12px;
      background: #052e22;
      border: 1px solid #34d399;
      border-radius: 8px;
      color: #6ee7b7;
      font-size: 13px;
      word-break: break-word;
    }
    footer { margin-top: 16px; color: #5f7391; font-size: 11.5px; }
  </style>
</head>
<body>
  <main>
    <h1>Scanner login</h1>
    <p class="sub">
      Plain sign-in form for automated scanners. The phone UI is the human
      path; this page calls the same <code>/api/auth/login</code> and
      <code>/api/auth/verify</code> endpoints.
    </p>

    <form id="login-form" autocomplete="on">
      <label for="app">Application</label>
      <select id="app">
        <option value="bank">Royal Banking (bank_user)</option>
        <option value="acadia">Acadia Student (student)</option>
      </select>

      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" placeholder="Enter username">

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password">

      <label for="totp">Authenticator code</label>
      <input id="totp" name="totp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6-digit code">

      <button id="submit" type="submit">Sign in</button>
    </form>

    <p id="status" aria-live="polite"></p>

    <footer>
      Lab accounts only. Failed attempts are rate limited per account.
    </footer>
  </main>

  <!-- External, because Helmet sends script-src 'self': an inline block is
       blocked and the form silently falls back to a native GET submit. -->
  <script src="/lab-login.js" defer></script>
</body>
</html>
